profile = "dist"
change-id = 163731

[build]
build-dir = "build-release" # keeps build/ (your dev build) untouched
allocator = "jemalloc"      # official builds use jemalloc
tools = ["cargo"]
docs = false

[rust]
channel = "nightly"
codegen-backends = ["llvm", "tpde"]
lto = "thin"
codegen-units = 1

[install]
prefix = "rustc-tpde-release"
sysconfdir = "etc"

[llvm]
download-ci-llvm = true
