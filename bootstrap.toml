profile = "dist"
change-id = 163731

[build]
allocator = "jemalloc"      # official builds use jemalloc
tools = ["cargo"]
docs = false
profiler = true
metrics = true

[rust]
channel = "nightly"
codegen-backends = ["llvm", "tpde", "cranelift"]
lto = "thin"
codegen-units = 1
frame-pointers = true
debuginfo-level-rustc = "line-tables-only"

[install]
prefix = "rustc-tpde-release"
sysconfdir = "etc"

[llvm]
download-ci-llvm = true
